name: Jan Systems SaaS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: jansystems_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install dependencies
      run: |
        cd apps/server
        npm install
        
    - name: Run Prisma Generate
      run: |
        cd apps/server
        npx prisma generate
        
    - name: Run Tests
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/jansystems_test"
        JWT_SECRET: "test_secret"
      run: |
        cd apps/server
        node --test tests/*.node.test.js
